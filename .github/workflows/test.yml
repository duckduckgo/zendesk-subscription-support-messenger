name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cooldown check (temporary)
        run: |
          npm --version
          npm config get min-release-age
          if npm pack --dry-run caniuse-lite@1.0.30001819 2>&1 | tee pack.log; then
            echo "FAIL: npm fetched a 6-day-old version, cooldown not enforced"
            exit 1
          fi
          grep 'with a date before' pack.log && echo "PASS: cooldown enforced"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
